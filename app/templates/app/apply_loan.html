<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Loan - SecureBank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        
        .nav-link {
            color: #666;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-link:hover {
            background: #f8f9fa;
        }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .form-title {
            color: #2c3e50;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #34495e;
            font-weight: 600;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .info-box {
            background: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        
        .info-title {
            color: #0c5460;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .info-text {
            color: #0c5460;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="{% url 'index' %}" class="logo">🏦 SecureBank</a>
            <div class="nav-links">
                <a href="{% url 'index' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'logout' %}" class="nav-link">Logout</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="form-card">
            <h1 class="form-title">💰 Apply for Loan</h1>
            
            <div class="info-box">
                <div class="info-title">📋 Application Information</div>
                <div class="info-text">
                    Please fill out the form below to apply for a loan. All fields are required for processing your application.
                    Our team will review your application and get back to you within 2-3 business days.
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">Loan Type *</label>
                    <select class="form-select" name="loan_type" required>
                        <option value="">Select Loan Type</option>
                        <option value="personal">Personal Loan</option>
                        <option value="home">Home Loan</option>
                        <option value="business">Business Loan</option>
                        <option value="education">Education Loan</option>
                        <option value="vehicle">Vehicle Loan</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Loan Amount (₹) *</label>
                        <input type="number" class="form-input" name="loan_amount" placeholder="Enter loan amount" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Loan Tenure (Years) *</label>
                        <select class="form-select" name="tenure" required>
                            <option value="">Select Tenure</option>
                            <option value="1">1 Year</option>
                            <option value="2">2 Years</option>
                            <option value="3">3 Years</option>
                            <option value="5">5 Years</option>
                            <option value="10">10 Years</option>
                            <option value="15">15 Years</option>
                            <option value="20">20 Years</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Monthly Income (₹) *</label>
                        <input type="number" class="form-input" name="monthly_income" placeholder="Enter monthly income" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Employment Type *</label>
                        <select class="form-select" name="employment_type" required>
                            <option value="">Select Employment Type</option>
                            <option value="salaried">Salaried</option>
                            <option value="self_employed">Self Employed</option>
                            <option value="business">Business Owner</option>
                            <option value="freelancer">Freelancer</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Company/Organization Name *</label>
                    <input type="text" class="form-input" name="company_name" placeholder="Enter company name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Work Experience (Years) *</label>
                        <input type="number" class="form-input" name="work_experience" placeholder="Years of experience" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Credit Score</label>
                        <input type="number" class="form-input" name="credit_score" placeholder="Enter credit score (if known)">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Purpose of Loan *</label>
                    <textarea class="form-textarea" name="purpose" rows="3" placeholder="Describe the purpose of your loan" required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Additional Information</label>
                    <textarea class="form-textarea" name="additional_info" rows="3" placeholder="Any additional information you'd like to share"></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit Application</button>
            </form>
        </div>
    </div>
</body>
</html>
